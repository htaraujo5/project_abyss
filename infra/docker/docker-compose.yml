# Porta pública do jogo: 8080
# No host com Let's Encrypt, faça proxy de
#   https://project_abyss.softnexware.com  →  http://127.0.0.1:8080
# (ver host-proxy.example.conf)

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: abyss
      POSTGRES_PASSWORD: abyss
      POSTGRES_DB: abyss
    # só na rede interna do compose (não expor na internet)
    expose:
      - '5432'
    volumes:
      - abyss_pg:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    expose:
      - '6379'

  api:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.api
    environment:
      PORT: 8787
      ABYSS_SANDBOX: vfs
      DATABASE_URL: postgres://abyss:abyss@postgres:5432/abyss
      REDIS_URL: redis://redis:6379
    # API só via nginx (web). Para debug local: descomente a linha ports.
    expose:
      - '8787'
    # ports:
    #   - '8787:8787'
    depends_on:
      - postgres
      - redis

  web:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.web
    ports:
      - '8080:80'
    depends_on:
      - api

volumes:
  abyss_pg:
