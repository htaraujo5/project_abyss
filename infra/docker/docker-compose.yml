# Portas no host (= porta dentro do container, pra proxy Docker/softnexware não errar):
#   web      8035  ← domínio aponta aqui
#   api      3344
#   postgres 48291
#   redis    49173
# Domínio: https://project_abyss.softnexware.com → http://127.0.0.1:8035
# Se o proxy rodar em outro container: http://web:8035 (não use :80)

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: abyss
      POSTGRES_PASSWORD: abyss
      POSTGRES_DB: abyss
    ports:
      - '48291:5432'
    volumes:
      - abyss_pg:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - '49173:6379'

  api:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.api
    environment:
      PORT: 3344
      ABYSS_SANDBOX: vfs
      DATABASE_URL: postgres://abyss:abyss@postgres:5432/abyss
      REDIS_URL: redis://redis:6379
    ports:
      - '3344:3344'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3344/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 20s
    depends_on:
      - postgres
      - redis

  web:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.web
    ports:
      - '8035:8035'
    depends_on:
      api:
        condition: service_healthy

volumes:
  abyss_pg:
