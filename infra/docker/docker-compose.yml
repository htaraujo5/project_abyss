# Dokploy (http://2.24.87.103:3000) + domínio abyss-project.softnexware.com
#
# Domains → Create Domain:
#   Host             = abyss-project.softnexware.com
#   Service          = web
#   Container Port   = 8035
#   HTTPS            = ON + Let's Encrypt
#
# Persistência: usuários/saves/sessões ficam em JSON no volume abyss_data
# (NÃO no Postgres ainda — DATABASE_URL é reservado para migração futura).
# Sem esse volume, todo redeploy apaga cadastros e progressos.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: abyss
      POSTGRES_PASSWORD: abyss
      POSTGRES_DB: abyss
    ports:
      - '48291:5432'
    volumes:
      - abyss_pg:/var/lib/postgresql/data
    networks:
      - abyss

  redis:
    image: redis:7-alpine
    ports:
      - '49173:6379'
    networks:
      - abyss

  api:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.api
    environment:
      PORT: 3344
      ABYSS_SANDBOX: vfs
      ABYSS_DATA_DIR: /app/apps/data
      DATABASE_URL: postgres://abyss:abyss@postgres:5432/abyss
      REDIS_URL: redis://redis:6379
    ports:
      - '3344:3344'
    volumes:
      - abyss_data:/app/apps/data
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3344/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 20s
    depends_on:
      - postgres
      - redis
    networks:
      - abyss

  web:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.web
    ports:
      - '8035:8035'
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    depends_on:
      api:
        condition: service_healthy
    networks:
      - abyss
      - dokploy-network

networks:
  abyss:
    driver: bridge
  dokploy-network:
    external: true

volumes:
  abyss_pg:
  abyss_data:
