# Docker DNS — re-resolve `api` se o container reiniciar (evita 502 com IP antigo)
resolver 127.0.0.11 valid=10s ipv6=off;

server {
  listen 8035;
  server_name project_abyss.softnexware.com localhost;

  root /usr/share/nginx/html;
  index index.html;

  set_real_ip_from 172.16.0.0/12;
  set_real_ip_from 10.0.0.0/8;
  set_real_ip_from 192.168.0.0/16;
  real_ip_header X-Forwarded-For;
  real_ip_recursive on;

  # Com variável no proxy_pass, NÃO coloque path no upstream —
  # o URI original (/api/..., /ws/...) é repassado intacto.
  location /api/ {
    set $api_host api;
    proxy_pass http://$api_host:3344;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_connect_timeout 5s;
  }

  location /ws/ {
    set $api_host api;
    proxy_pass http://$api_host:3344;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 86400;
    proxy_connect_timeout 5s;
  }

  location / {
    try_files $uri /index.html;
  }
}
