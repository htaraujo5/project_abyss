upstream abyss_api {
  # Via porta publicada no host — estável no Dokploy quando o DNS
  # entre containers (api:3344) falha na rede mista dokploy-network.
  server host.docker.internal:3344;
  keepalive 16;
}

server {
  listen 8035;
  server_name project_abyss.softnexware.com localhost;

  root /usr/share/nginx/html;
  index index.html;

  set_real_ip_from 172.16.0.0/12;
  set_real_ip_from 10.0.0.0/8;
  set_real_ip_from 192.168.0.0/16;
  real_ip_header X-Forwarded-For;
  real_ip_recursive on;

  location /api/ {
    proxy_pass http://abyss_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_connect_timeout 5s;
    proxy_next_upstream error timeout http_502;
  }

  location /ws/ {
    proxy_pass http://abyss_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 86400;
    proxy_connect_timeout 5s;
  }

  location / {
    try_files $uri /index.html;
  }
}
