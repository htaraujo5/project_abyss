# Exemplo para o nginx do HOST (onde o Let's Encrypt já está).
# Aponte o domínio para a porta pública do front: 8035
#
# Uso típico:
#   1) docker compose -f infra/docker/docker-compose.yml up -d --build
#   2) copie este bloco para o vhost de abyss-project.softnexware.com
#   3) nginx -t && systemctl reload nginx

server {
  listen 80;
  server_name abyss-project.softnexware.com;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl http2;
  server_name abyss-project.softnexware.com;

  # ajuste para os caminhos reais do seu certificado Let's Encrypt
  ssl_certificate     /etc/letsencrypt/live/abyss-project.softnexware.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/abyss-project.softnexware.com/privkey.pem;
  include /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

  location / {
    proxy_pass http://127.0.0.1:8035;
    # Se softnexware/proxy estiver na rede Docker deste compose, use em vez disso:
    # proxy_pass http://web:8035;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 86400;
  }
}

